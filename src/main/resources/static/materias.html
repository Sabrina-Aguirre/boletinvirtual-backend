<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BoletínVirtual — Materias</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e0f14; --surface: #16181f; --surface2: #1e2029;
      --border: #2a2d3a; --accent: #38bdf8; --text: #e8e9f0;
      --text-muted: #7b7e8f; --success: #4ade80; --danger: #f87171; --radius: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; gap: 2rem; height: 60px; position: sticky; top: 0; z-index: 100; }
    .nav-brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem; color: #6c63ff; text-decoration: none; }
    .nav-links { display: flex; gap: 0.25rem; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.875rem; font-weight: 500; padding: 0.4rem 0.9rem; border-radius: 8px; transition: all 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); background: var(--surface2); }
    .nav-links a.active { color: var(--accent); }
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
    .page-title { font-family: 'Syne', sans-serif; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
    .page-title span { color: var(--accent); }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.55rem 1.1rem; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-primary { background: var(--accent); color: #0e0f14; }
    .btn-primary:hover { background: #0ea5d8; transform: translateY(-1px); }
    .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 0.3rem 0.7rem; font-size: 0.8rem; }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-edit { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 0.3rem 0.7rem; font-size: 0.8rem; }
    .btn-edit:hover { background: var(--accent); color: #0e0f14; }
    .btn-cancel { background: var(--surface2); color: var(--text-muted); border: none; }
    .btn-cancel:hover { color: var(--text); }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 480px; animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .modal-title { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 1.5rem; }
    .modal-footer { display: flex; gap: 0.75rem; justify-content: flex-end; margin-top: 1.5rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group select { width: 100%; padding: 0.65rem 0.9rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; transition: border-color 0.2s; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
    .form-group select option { background: var(--surface2); }
    .table-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .table-header { padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .table-header-title { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .badge { background: var(--surface2); color: var(--text-muted); font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 999px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; }
    thead tr { border-bottom: 1px solid var(--border); }
    th { padding: 0.75rem 1.5rem; text-align: left; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    td { padding: 0.9rem 1.5rem; font-size: 0.9rem; }
    .td-id { color: var(--text-muted); font-size: 0.8rem; font-family: monospace; }
    .td-actions { display: flex; gap: 0.5rem; }
    .chip { display: inline-flex; align-items: center; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.75rem; color: var(--text-muted); }
    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 300; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--success); border-radius: 8px; padding: 0.75rem 1.25rem; font-size: 0.875rem; animation: fadeIn 0.2s ease; min-width: 220px; }
    .toast.error { border-left-color: var(--danger); }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .empty-state { padding: 3rem; text-align: center; color: var(--text-muted); }
    .empty-state p { margin-top: 0.5rem; font-size: 0.875rem; }
    .search-input { padding: 0.5rem 0.9rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.875rem; outline: none; width: 220px; transition: border-color 0.2s; }
    .search-input:focus { border-color: var(--accent); }
  </style>
</head>
<body>

<nav>
  <a href="#" class="nav-brand">📋 BoletínVirtual</a>
  <div class="nav-links">
    <a href="alumnos.html">Alumnos</a>
    <a href="profesores.html">Profesores</a>
    <a href="materias.html" class="active">Materias</a>
    <a href="calificaciones.html">Calificaciones</a>
    <a href="reporte.html">Reporte</a>
  </div>
</nav>

<div class="container">
  <div class="page-header">
    <h1 class="page-title">Gestión de <span>Materias</span></h1>
    <button class="btn btn-primary" onclick="abrirModalCrear()">+ Nueva materia</button>
  </div>

  <div class="table-wrapper">
    <div class="table-header">
      <span class="table-header-title">Listado <span id="badge-count" class="badge">0</span></span>
      <input class="search-input" type="text" placeholder="Buscar materia..." oninput="filtrar(this.value)" />
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th>Código</th>
          <th>Profesor</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-materias"></tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display:none">
      <strong>Sin materias</strong>
      <p>Hacé clic en "Nueva materia" para agregar la primera.</p>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 class="modal-title" id="modal-title">Nueva materia</h2>
    <input type="hidden" id="materia-id" />
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" id="input-nombre" placeholder="Ej: Laboratorio de Software" />
    </div>
    <div class="form-group">
      <label>Código</label>
      <input type="number" id="input-codigo" placeholder="Ej: 101" />
    </div>
    <div class="form-group">
      <label>Profesor</label>
      <select id="input-profesor">
        <option value="">Seleccioná un profesor...</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script>
  const API_MATERIAS   = 'http://localhost:8080/api/materia';
  const API_PROFESORES = 'http://localhost:8080/api/profesor';
  let materias   = [];
  let profesores = [];

  async function cargar() {
    try {
      const [resMaterias, resProfesores] = await Promise.all([
        fetch(API_MATERIAS),
        fetch(API_PROFESORES)
      ]);
      materias   = await resMaterias.json();
      profesores = await resProfesores.json();
      renderTabla(materias);
      cargarSelectProfesores();
    } catch (e) {
      toast('No se pudo conectar con el servidor', true);
    }
  }

  function cargarSelectProfesores() {
    const sel = document.getElementById('input-profesor');
    const current = sel.value;
    sel.innerHTML = '<option value="">Seleccioná un profesor...</option>';
    profesores.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.idProfesor;
      opt.textContent = `${p.apellido}, ${p.nombre}`;
      sel.appendChild(opt);
    });
    if (current) sel.value = current;
  }

  function nombreProfesor(idProfesor) {
    const p = profesores.find(x => x.idProfesor === idProfesor);
    return p ? `${p.apellido}, ${p.nombre}` : '—';
  }

  function renderTabla(data) {
    const tbody = document.getElementById('tabla-materias');
    const empty = document.getElementById('empty-state');
    document.getElementById('badge-count').textContent = data.length;
    if (data.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = data.map(m => `
      <tr>
        <td class="td-id">${m.id_materia}</td>
        <td><strong>${m.nombre}</strong></td>
        <td><span class="chip">${m.codigo}</span></td>
        <td>${m.profesor ? nombreProfesor(m.profesor.idProfesor) : '—'}</td>
        <td class="td-actions">
          <button class="btn btn-edit" onclick="abrirModalEditar(${m.id_materia})">Editar</button>
          <button class="btn btn-danger" onclick="eliminar(${m.id_materia})">Eliminar</button>
        </td>
      </tr>
    `).join('');
  }

  function filtrar(q) {
    const filtrado = materias.filter(m =>
      `${m.nombre} ${m.codigo}`.toLowerCase().includes(q.toLowerCase())
    );
    renderTabla(filtrado);
  }

  function abrirModalCrear() {
    document.getElementById('modal-title').textContent = 'Nueva materia';
    document.getElementById('materia-id').value = '';
    document.getElementById('input-nombre').value = '';
    document.getElementById('input-codigo').value = '';
    document.getElementById('input-profesor').value = '';
    document.getElementById('modal-overlay').classList.add('open');
  }

  function abrirModalEditar(id) {
    const m = materias.find(x => x.id_materia === id);
    if (!m) return;
    document.getElementById('modal-title').textContent = 'Editar materia';
    document.getElementById('materia-id').value = m.id_materia;
    document.getElementById('input-nombre').value = m.nombre;
    document.getElementById('input-codigo').value = m.codigo;
    document.getElementById('input-profesor').value = m.profesor ? m.profesor.idProfesor : '';
    document.getElementById('modal-overlay').classList.add('open');
  }

  function cerrarModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  async function guardar() {
    const id       = document.getElementById('materia-id').value;
    const nombre   = document.getElementById('input-nombre').value.trim();
    const codigo   = document.getElementById('input-codigo').value.trim();
    const idProf   = document.getElementById('input-profesor').value;

    if (!nombre || !codigo || !idProf) {
      toast('Completá todos los campos', true); return;
    }

    const body = {
      nombre,
      codigo: parseInt(codigo),
      profesor: { idProfesor: parseInt(idProf) }
    };

    try {
      if (id) {
        body.id_materia = parseInt(id);
        await fetch(API_MATERIAS, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        toast('Materia actualizada');
      } else {
        await fetch(API_MATERIAS, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        toast('Materia creada');
      }
      cerrarModal();
      cargar();
    } catch (e) {
      toast('Error al guardar', true);
    }
  }

  async function eliminar(id) {
    if (!confirm('¿Eliminar esta materia?')) return;
    try {
      await fetch(`${API_MATERIAS}/${id}`, { method: 'DELETE' });
      toast('Materia eliminada');
      cargar();
    } catch (e) {
      toast('Error al eliminar', true);
    }
  }

  function toast(msg, error = false) {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'toast' + (error ? ' error' : '');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) cerrarModal();
  });

  cargar();
</script>
</body>
</html>
